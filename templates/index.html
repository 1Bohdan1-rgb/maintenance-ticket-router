<!doctype html>
<html lang="{{ default_lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ t.meta_title }}</title>
<style>
  :root {
    --bg: #17181a;
    --card-bg: #24262a;
    --card-border: #34383e;
    --field-bg: #1c1e21;
    --field-border: #3a3f45;
    --field-border-focus: #f97316;
    --text: #f2f3f4;
    --text-muted: #9aa0a6;
    --orange: #f97316;
    --orange-hover: #fb8c3c;
    --yellow: #fbbf24;
    --red: #dc2626;
    --green: #16a34a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(249, 115, 22, 0.08), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(251, 191, 36, 0.06), transparent 40%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px 60px;
  }
  .page {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .lang-switcher {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .lang-btn {
    background: transparent;
    border: 1px solid var(--field-border);
    color: var(--text-muted);
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .lang-btn:hover { border-color: var(--orange); color: var(--text); }
  .lang-btn.active {
    background: var(--orange);
    border-color: var(--orange);
    color: #1a1a1a;
  }
  .card {
    width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
    overflow: hidden;
  }
  .hazard-bar {
    height: 7px;
    background: repeating-linear-gradient(
      45deg,
      var(--yellow),
      var(--yellow) 12px,
      #1a1a1a 12px,
      #1a1a1a 24px
    );
  }
  .card-inner { padding: 32px 28px 28px; }
  .brand { text-align: center; margin-bottom: 28px; }
  .brand-icons { font-size: 30px; margin-bottom: 6px; letter-spacing: 4px; }
  .brand h1 {
    margin: 0 0 6px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .brand .subtitle {
    margin: 0;
    color: var(--text-muted);
    font-size: 14px;
  }
  .field { margin-bottom: 18px; }
  .field-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .field-icon-wrap { position: relative; }
  .field-icon {
    position: absolute;
    left: 14px;
    top: 14px;
    font-size: 16px;
    pointer-events: none;
    opacity: 0.85;
  }
  textarea, input[type="email"] {
    width: 100%;
    background: var(--field-bg);
    border: 1px solid var(--field-border);
    border-radius: 10px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 12px 14px 12px 40px;
    resize: vertical;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea::placeholder, input::placeholder { color: #6b7178; }
  textarea:focus, input:focus {
    outline: none;
    border-color: var(--field-border-focus);
    box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.2);
  }
  input[type="email"] { padding-top: 12px; padding-bottom: 12px; }
  .submit-btn {
    width: 100%;
    background: var(--orange);
    color: #1a1305;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .submit-btn:hover:not(:disabled) { background: var(--orange-hover); }
  .submit-btn:active:not(:disabled) { transform: scale(0.98); }
  .submit-btn:disabled { opacity: 0.7; cursor: default; }
  .form-error {
    background: rgba(220, 38, 38, 0.12);
    border: 1px solid rgba(220, 38, 38, 0.4);
    color: #fca5a5;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .hidden { display: none !important; }

  .result {
    margin-top: 24px;
    padding-top: 22px;
    border-top: 1px dashed var(--field-border);
  }
  .result-heading {
    font-size: 16px;
    font-weight: 800;
    margin: 0 0 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .result-heading::before { content: "✅"; font-size: 16px; }
  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }
  .result-row:last-of-type { border-bottom: none; }
  .result-row .label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
  }
  .result-row .value { font-size: 14px; font-weight: 600; text-align: right; }
  .result-reason {
    margin-top: 10px;
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.5;
  }
  .result-reason .label {
    display: block;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .pill {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
  }
  .badge-emergency { background: var(--red); }
  .badge-high { background: var(--orange); }
  .badge-medium { background: var(--yellow); color: #3b2f00; }
  .badge-low { background: var(--green); }

  .new-request-btn {
    width: 100%;
    margin-top: 20px;
    background: transparent;
    border: 1px solid var(--field-border);
    color: var(--text);
    border-radius: 10px;
    padding: 11px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .new-request-btn:hover { border-color: var(--orange); color: var(--orange); }

  @media (max-width: 420px) {
    body { padding: 20px 10px 40px; }
    .card-inner { padding: 24px 18px 20px; }
    .brand h1 { font-size: 19px; }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="lang-switcher" id="lang-switcher">
      <button type="button" class="lang-btn" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="pl">PL</button>
      <button type="button" class="lang-btn" data-lang="uk">UA</button>
    </div>

    <div class="card">
      <div class="hazard-bar"></div>
      <div class="card-inner">
        <div class="brand">
          <div class="brand-icons">🔧🛠️⚡🔩</div>
          <h1 data-i18n="brand_title">{{ t.brand_title }}</h1>
          <p class="subtitle" data-i18n="brand_subtitle">{{ t.brand_subtitle }}</p>
        </div>

        <form id="ticket-form" novalidate>
          <div class="field">
            <label class="field-label" data-i18n="description_label">{{ t.description_label }}</label>
            <div class="field-icon-wrap">
              <span class="field-icon">🔧</span>
              <textarea id="description" rows="5" data-i18n-placeholder="description_placeholder" placeholder="{{ t.description_placeholder }}"></textarea>
            </div>
          </div>

          <div class="field">
            <label class="field-label" data-i18n="email_label">{{ t.email_label }}</label>
            <div class="field-icon-wrap">
              <span class="field-icon">✉️</span>
              <input type="email" id="customer_email" data-i18n-placeholder="email_placeholder" placeholder="{{ t.email_placeholder }}">
            </div>
          </div>

          <p id="form-error" class="form-error hidden"></p>

          <button type="submit" class="submit-btn" id="submit-btn" data-i18n="submit_button">{{ t.submit_button }}</button>
        </form>

        <div class="result hidden" id="result">
          <h2 class="result-heading" id="result-heading"></h2>

          <div class="result-row">
            <span class="label" id="result-category-label"></span>
            <span class="value" id="result-category-value"></span>
          </div>
          <div class="result-row">
            <span class="label" id="result-priority-label"></span>
            <span class="value"><span class="pill" id="result-priority-value"></span></span>
          </div>
          <div class="result-row">
            <span class="label" id="result-technician-label"></span>
            <span class="value" id="result-technician-value"></span>
          </div>

          <div class="result-reason hidden" id="result-reason-row">
            <span class="label" id="result-reason-label"></span>
            <span id="result-reason-value"></span>
          </div>

          <button type="button" class="new-request-btn" id="new-request-btn" data-i18n="new_request_button"></button>
        </div>
      </div>
    </div>
  </div>

<script>
  const TRANSLATIONS = {{ translations_json|safe }};
  let currentLang = "{{ default_lang }}";
  let lastResult = null;

  function applyLang(lang) {
    if (!TRANSLATIONS[lang]) return;
    currentLang = lang;
    const t = TRANSLATIONS[lang];

    document.title = t.meta_title;
    document.documentElement.lang = t.html_lang;

    document.querySelectorAll('[data-i18n]').forEach((el) => {
      const key = el.getAttribute('data-i18n');
      if (t[key]) el.textContent = t[key];
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => {
      const key = el.getAttribute('data-i18n-placeholder');
      if (t[key]) el.placeholder = t[key];
    });
    document.querySelectorAll('.lang-btn').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.lang === lang);
    });

    if (lastResult) renderResult(lastResult);
  }

  function renderResult(data) {
    lastResult = data;
    const t = TRANSLATIONS[currentLang];
    const categoryName = (t.category_names && t.category_names[data.category]) || data.category || '—';
    const priorityName = (t.priority_names && t.priority_names[data.priority]) || data.priority || '—';
    const technicianName = data.assignee ? data.assignee.name : null;

    document.getElementById('result-heading').textContent = t.result_heading.replace('{id}', data.id);
    document.getElementById('result-category-label').textContent = t.category_label;
    document.getElementById('result-category-value').textContent = categoryName;
    document.getElementById('result-priority-label').textContent = t.priority_label;

    const priorityBadge = document.getElementById('result-priority-value');
    priorityBadge.textContent = priorityName;
    priorityBadge.className = 'pill badge-' + (data.priority || 'medium');

    document.getElementById('result-technician-label').textContent = t.technician_label;
    document.getElementById('result-technician-value').textContent = technicianName || t.unassigned_text;

    const reasonRow = document.getElementById('result-reason-row');
    if (data.urgency_reason) {
      reasonRow.classList.remove('hidden');
      document.getElementById('result-reason-label').textContent = t.reason_label;
      document.getElementById('result-reason-value').textContent = data.urgency_reason;
    } else {
      reasonRow.classList.add('hidden');
    }

    document.getElementById('new-request-btn').textContent = t.new_request_button;
    document.getElementById('result').classList.remove('hidden');
  }

  document.querySelectorAll('.lang-btn').forEach((btn) => {
    btn.addEventListener('click', () => applyLang(btn.dataset.lang));
  });

  const form = document.getElementById('ticket-form');
  const errorEl = document.getElementById('form-error');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const t = TRANSLATIONS[currentLang];
    const description = document.getElementById('description').value.trim();
    const email = document.getElementById('customer_email').value.trim();

    errorEl.classList.add('hidden');

    if (!description) {
      errorEl.textContent = t.error_required;
      errorEl.classList.remove('hidden');
      return;
    }

    const title = description.length > 60 ? description.slice(0, 60) + '…' : description;

    submitBtn.disabled = true;
    submitBtn.textContent = t.submit_button_loading;

    try {
      const response = await fetch('/tickets', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=utf-8' },
        body: JSON.stringify({
          title: title,
          description: description,
          customer_email: email || undefined,
          lang: currentLang,
        }),
      });

      if (!response.ok) throw new Error('request failed');

      const data = await response.json();
      renderResult(data);
      form.reset();
    } catch (err) {
      errorEl.textContent = t.error_generic;
      errorEl.classList.remove('hidden');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = t.submit_button;
    }
  });

  document.getElementById('new-request-btn').addEventListener('click', () => {
    document.getElementById('result').classList.add('hidden');
    lastResult = null;
  });

  applyLang(currentLang);
</script>
</body>
</html>
